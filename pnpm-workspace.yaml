packages:
  - 'frontend'
  - 'backend'
  - 'firebase'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.5'
  # Patched versions for transitive `pnpm audit` high/critical findings.
  # Each stays within the major version its parent already uses.
  js-yaml: '^4.3.2'
  nanoid@3: '^3.3.18'
  source-map-js: '^1.2.2'
  vite@7: '^7.3.7'
  '@grpc/grpc-js@1': '^1.14.6'
  '@fastify/busboy@3': '^3.2.1'
  body-parser@1: '^1.20.9'
  body-parser@2: '^2.4.0'
  brace-expansion@1: '^1.1.20'
  brace-expansion@2: '^2.1.6'
  brace-expansion@5: '^5.0.11'
  proxy-addr: '^2.0.8'

auditConfig:
  # Accepted risks — the only fixes are major upgrades (zod 4, vitest 4), tracked separately.
  ignoreGhsas:
    # zod <4.6.6: memory exhaustion when validating oversized constrained collections.
    # Our schemas validate bounded strings, not large arrays.
    - GHSA-mrhx-c7xc-m3w5
    # tinypool <2.1.2: prototype pollution via worker options. Only used by Vitest
    # in local/CI test runs; never shipped to users.
    - GHSA-5gmw-xhrv-c9v3
    - GHSA-85c8-ppgw-ccpr

allowBuilds:
  '@firebase/util': true
  '@google/genai': set this to true or false
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
